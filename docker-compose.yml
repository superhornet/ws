services:
  node-app:
    build: .
    image: westack-node-app
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVER_PORT: ${SERVER_PORT:-3000}
      # The Docker stack is self-contained: the node app always talks to the
      # local `postgres` service below, NOT whatever DB the host .env points at.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${LOCAL_DB_USER:-westack}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-westack_local_dev}
      POSTGRES_DATABASE: ${LOCAL_DB_NAME:-westack}
      POSTGRES_PORT: 5432
      POSTGRES_MAX: ${POSTGRES_MAX:-10}
      POSTGRES_IDLETIMEOUT: ${POSTGRES_IDLETIMEOUT:-30000}
      POSTGRES_CONNECTIONTIMEOUT: ${POSTGRES_CONNECTIONTIMEOUT:-2000}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-local-docker-otp-secret-change-me}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_RESEND_AFTER_SECONDS: ${OTP_RESEND_AFTER_SECONDS:-30}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_SMS_WEBHOOK_URL: ${OTP_SMS_WEBHOOK_URL:-}
      OTP_EMAIL_WEBHOOK_URL: ${OTP_EMAIL_WEBHOOK_URL:-}
      OTP_PROVIDER_AUTH_TOKEN: ${OTP_PROVIDER_AUTH_TOKEN:-}
      OTP_DEV_LOG: ${OTP_DEV_LOG:-false}
      OTP_DEV_EXPOSE: ${OTP_DEV_EXPOSE:-true}
      OTP_DEV_FIXED_CODE: ${OTP_DEV_FIXED_CODE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    container_name: westack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-westack}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-westack_local_dev}
      POSTGRES_DB: ${LOCAL_DB_NAME:-westack}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-westack} -d ${LOCAL_DB_NAME:-westack}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
