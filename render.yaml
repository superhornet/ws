# Render Blueprint for the WeStack API.
#
# Defines ONE project with TWO environments:
#   - staging    -> what the TestFlight beta build points at (separate data)
#   - production -> what the App Store release points at (real data)
#
# Postgres is hosted on Supabase, NOT on Render. Each environment points at its
# OWN Supabase project (a separate staging project keeps beta data away from
# production data), so there is no `databases:` block here and no `fromDatabase`
# wiring. Each `DATABASE_URL` is provided as a `sync: false` secret — paste the
# Supabase connection string on deploy. `permissions.protection: enabled` on
# production still requires an admin for destructive changes to the service.
#
# Schema is managed by node-pg-migrate, but production/staging migrations are not
# applied automatically by deploys. Run migrations as an explicit maintenance
# operation after taking a database backup. The schema uses gen_random_uuid()
# (available on PG 13+, which Supabase ships), so no specific major version is
# required.
#
# Use the Supabase Session pooler connection string (IPv4-friendly, suited to a
# long-lived pg Pool) and keep POSTGRES_SSL=true since Supabase requires TLS.
#
# Secrets (DATABASE_URL, Cybrid/Privy keys, OTP provider tokens) use `sync:
# false` so Render prompts for them on deploy instead of storing them in git.

projects:
  - name: westack
    environments:
      # ----------------------------------------------------------------------
      # PRODUCTION
      # ----------------------------------------------------------------------
      - name: production
        permissions:
          protection: enabled
        services:
          - name: westack-api
            type: web
            runtime: docker
            dockerfilePath: ./Dockerfile
            plan: starter
            branch: main
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              # Supabase (production project) Session pooler connection string.
              - key: DATABASE_URL
                sync: false
              - key: POSTGRES_SSL
                value: "true"
              - key: POSTGRES_SSL_REJECT_UNAUTHORIZED
                value: "false"
              - key: TRUST_PROXY
                value: "1"
              - key: OTP_HASH_SECRET
                generateValue: true
              - key: OTP_DEV_EXPOSE
                value: "false"
              - key: OTP_DEV_LOG
                value: "false"
              # Real OTP delivery via your otp-relay (Twilio/SendGrid).
              - key: OTP_SMS_WEBHOOK_URL
                sync: false
              - key: OTP_EMAIL_WEBHOOK_URL
                sync: false
              - key: OTP_PROVIDER_AUTH_TOKEN
                sync: false
              # Cybrid (production). API base/auth default to sandbox in code;
              # set the live URLs here when you go live.
              - key: CYBRID_CLIENT_ID
                sync: false
              - key: CYBRID_CLIENT_SECRET
                sync: false
              - key: CYBRID_API_BASE
                sync: false
              - key: CYBRID_AUTH_URL
                sync: false
              # Privy (production app).
              - key: PRIVY_APP_ID
                sync: false
              - key: PRIVY_APP_SECRET
                sync: false
              - key: PRIVY_API_URL
                sync: false

      # ----------------------------------------------------------------------
      # STAGING  (TestFlight beta target)
      # ----------------------------------------------------------------------
      - name: staging
        services:
          - name: westack-api-staging
            type: web
            runtime: docker
            dockerfilePath: ./Dockerfile
            plan: starter
            # Staging is a pre-prod gate: it deploys from the dedicated `staging`
            # branch so beta (TestFlight) code can be validated before it is
            # merged into `main` for the production App Store release.
            branch: staging
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              # Supabase (staging project) Session pooler connection string. Use
              # a SEPARATE Supabase project from production so beta data stays
              # isolated.
              - key: DATABASE_URL
                sync: false
              - key: POSTGRES_SSL
                value: "true"
              - key: POSTGRES_SSL_REJECT_UNAUTHORIZED
                value: "false"
              - key: TRUST_PROXY
                value: "1"
              - key: OTP_HASH_SECRET
                generateValue: true
              - key: OTP_DEV_EXPOSE
                value: "false"
              - key: OTP_DEV_LOG
                value: "false"
              # For easier beta testing you can wire the relay below, OR set a
              # fixed code so testers don't need real SMS (less secure).
              - key: OTP_SMS_WEBHOOK_URL
                sync: false
              - key: OTP_EMAIL_WEBHOOK_URL
                sync: false
              - key: OTP_PROVIDER_AUTH_TOKEN
                sync: false
              # Cybrid sandbox for staging.
              - key: CYBRID_CLIENT_ID
                sync: false
              - key: CYBRID_CLIENT_SECRET
                sync: false
              # Privy (staging app).
              - key: PRIVY_APP_ID
                sync: false
              - key: PRIVY_APP_SECRET
                sync: false
              - key: PRIVY_API_URL
                sync: false

          - name: otp-relay-staging
            type: web
            runtime: node
            rootDir: otp-relay
            plan: starter
            branch: staging
            buildCommand: npm ci
            startCommand: npm start
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: RELAY_AUTH_TOKEN
                sync: false
              # Twilio (SMS). Use either TWILIO_MESSAGING_SERVICE_SID or
              # TWILIO_FROM_NUMBER in addition to the account credentials.
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_MESSAGING_SERVICE_SID
                sync: false
              - key: TWILIO_FROM_NUMBER
                sync: false
              # SendGrid (email).
              - key: SENDGRID_API_KEY
                sync: false
              - key: SENDGRID_FROM_EMAIL
                sync: false
